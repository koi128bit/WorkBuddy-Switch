name: Build desktop applications
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - if: startsWith(matrix.platform, 'linux')
        name: Prepare native Linux desktop and secure keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring libsecret-tools libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libnotify4 libfuse2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
      - if: '!startsWith(matrix.platform, ''linux'')'
        run: npm run test:smoke
      - if: startsWith(matrix.platform, 'linux')
        name: Native Linux Electron smoke with system encryption
        run: dbus-run-session -- bash scripts/linux-smoke.sh
      - if: matrix.platform == 'mac'
        run: npx playwright install chromium
      - if: matrix.platform == 'mac'
        run: npm run test:ui
      - if: matrix.platform == 'mac'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: matrix.platform == 'win'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: startsWith(matrix.platform, 'linux')
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy-Switch-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
            dist/*-portable.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: WorkBuddy-Switch-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "WorkBuddy Switch $GITHUB_REF_NAME" --notes-file docs/release-notes.md --latest
